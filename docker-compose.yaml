# ============================================================
# VOLUMES E REDES
# ============================================================
volumes:
  listing-elastic-data:
  leilao-kafka-data:
  review-postgres-data:
  qa-postgres-data:
  qa-redis-data:
  report-service-postgres-data:
  paymentdb-data:
  transactiondb-data:
  notificationdb-data:
  userservicedb-data:
  keycloak-data:
  oleiloeiro-prometheus-data:
  oleiloeiro-grafana-data:
  tempo-data:

networks:
  leilao-network:
    name: leilao-network

# ============================================================
# INFRAESTRUTURA
# ============================================================
services:
  # ============================================================
  # EUREKA SERVER
  # ============================================================
  eureka-server:
    container_name: eureka-server
    image: steeltoeoss/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - leilao-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: apache/kafka:4.3.0
    container_name: leilao-kafka
    ports:
      - "9092:9092"
    networks:
      - leilao-network
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - leilao-kafka-data:/var/lib/kafka/data
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 120s

  # ============================================================
  # KAFKA INIT
  # ============================================================
  kafka-init:
    container_name: kafka-init-python
    image: pedrovncs/kafka-init-python:latest
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: "no"
    networks:
      - leilao-network

  # ============================================================
  # KAFKA UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: leilao-kafka-ui
    networks:
      - leilao-network
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: leilao-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ============================================================
  # KAFKA CONNECT
  # ============================================================
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: auction-kafka-connect
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: auction-connect-cluster
      CONFIG_STORAGE_TOPIC: auction_connect_configs
      OFFSET_STORAGE_TOPIC: auction_connect_offsets
      STATUS_STORAGE_TOPIC: auction_connect_statuses

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auction-postgres:
        condition: service_healthy
    networks:
      - leilao-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ============================================================
  # KAFKA CONNECT INIT
  # ============================================================
  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: auction-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./config/postgres_config.json:/config/postgres_config.json:ro
      - ./config/register-connector.sh:/config/register-connector.sh:ro
    networks:
      - leilao-network
    entrypoint: [ "/bin/sh", "/config/register-connector.sh" ]

  # ============================================================
  # KSQL SERVER
  # ============================================================
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb-server
    networks:
      - leilao-network
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SERVICE_ID: "ksql_service_01"
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8088 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ============================================================
  # KSQL INIT
  # ============================================================
  ksqldb-init:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-init
    networks:
      - leilao-network
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ksqldb-server:
        condition: service_healthy
    volumes:
      - ./config/ksqldb/init:/scripts
      - ./config/ksqldb-init.sh:/init.sh
    entrypoint: [ "/bin/sh", "/init.sh" ]

  # ============================================================
  # KSQL CLI
  # ============================================================
  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-cli
    networks:
      - leilao-network
    depends_on:
      ksqldb-server:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c", "sleep infinity" ]
    tty: true

  # ============================================================
  # KEYCLOAK
  # ============================================================
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.6.2
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_FRONTEND_URL: ${KEYCLOAK_EXTERNAL_URL}
      KC_DB_USERNAME: ${USER_SERVICE_DB_USER}
      KC_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      KC_HEALTH_ENABLED: true
    ports:
      - "${KEYCLOAK_PORT}:8080"
    command: start-dev --import-realm
    networks:
      - leilao-network
    restart: unless-stopped
    depends_on:
      user-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "cat /dev/null > /dev/tcp/127.0.0.1/8080 || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 180s

  # ============================================================
  # API GATEWAY
  # ============================================================
  api-gateway:
    container_name: api-gateway
    image: shyuu7/api-gateway:latest
    ports:
      - "9999:9999"
    networks:
      - leilao-network
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL}
      KEYCLOAK_CLIENT_SECRET_API_GATEWAY: ${KEYCLOAK_CLIENT_SECRET_API_GATEWAY}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      FRONTEND_URL: ${FRONTEND_URL}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: oleiloeiro-prometheus
    networks:
      - leilao-network
    ports:
      - "9090:9090"
    volumes:
      - oleiloeiro-prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: oleiloeiro-grafana
    networks:
      - leilao-network
    ports:
      - "1234:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - oleiloeiro-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - tempo

  # ============================================================
  # ELASTICSEARCH
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9300:9200"
    networks:
      - leilao-network

  # ============================================================
  # KIBANA
  # ============================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - leilao-network

  # ============================================================
  # LOGSTASH
  # ============================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.2
    container_name: logstash
    ports:
      - "5000:5000"
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - leilao-network

  # ============================================================
  # OPEN TELEMETRY COLLECTOR
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: oleiloeiro-otel-collector
    networks:
      - leilao-network
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "9411:9411" # Se a explicação exportar ‘logs’ no formato do Zipkin
      - "4317:4317" # Normalmente utilizada com o protocolo grpc
      - "4318:4318" # Utilizada com o protocolo HTTP
    depends_on:
      - tempo

  # ============================================================
  # GRAFANA TEMPO
  # ============================================================
  tempo:
    image: grafana/tempo:latest
    container_name: oleiloeiro-tempo
    user: "0:0"
    command: [ "--config.file=/etc/tempo.yml" ]
    networks:
      - leilao-network
    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317"
      - "4318"

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: leilao-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - leilao-network

  # ============================================================
  # USER-SERVICE REDIS
  # ============================================================
  user-service-redis:
    image: redis:8.8.0-alpine
    container_name: user-service-redis
    ports:
      - "${USER_SERVICE_REDIS_PORT}:6379"
    networks:
      - leilao-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # USER-SERVICE DATABASE
  # ============================================================
  user-service-db:
    container_name: user-service-db
    image: postgres:17-alpine3.23
    volumes:
      - userservicedb-data:/var/lib/postgresql/data
      - ./src/main/resources/db/user-service:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${USER_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      POSTGRES_DB: userservicedb
    ports:
      - "${USER_SERVICE_DB_PORT}:5432"
    networks:
      - leilao-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d userservicedb -U ${USER_SERVICE_DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ============================================================
  # PAYMENT-SERVICE DATABASE
  # ============================================================
  paymentdb:
    container_name: paymentdb
    image: postgres:17-alpine3.23
    networks:
      - leilao-network
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${PAYMENT_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAYMENT_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "${PAYMENT_SERVICE_POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - paymentdb-data:/var/lib/postgresql/data
      - ./src/main/resources/db/payment-service:/docker-entrypoint-initdb.d

  # ============================================================
  # REVIEW-SERVICE DATABASE
  # ============================================================
  review-postgres:
    image: postgres:17-alpine3.23
    container_name: review-postgres
    ports:
      - "${REVIEW_SERVICE_DB_PORT}:5432"
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: ${REVIEW_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${REVIEW_SERVICE_DB_PASSWORD}
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db/review-service:/docker-entrypoint-initdb.d
    networks:
      - leilao-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
  # ============================================================
  # AUCTION-SERVICE DATABASE
  # ============================================================
  auction-postgres:
    image: postgres:17-alpine3.23
    container_name: auction-service-postgres
    environment:
      POSTGRES_USER: ${AUCTION_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUCTION_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${AUCTION_SERVICE_POSTGRES_PORT}:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=1"
      - "-c"
      - "max_replication_slots=1"
    volumes:
      - ./src/main/resources/db/auction-service:/docker-entrypoint-initdb.d
    networks:
      - leilao-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUCTION_SERVICE_POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # QA-SERVICE DATABASE
  # ============================================================
  postgres-qa:
    image: postgres:17-alpine3.23
    container_name: qa-service-postgres
    environment:
      POSTGRES_DB: qa_service_db
      POSTGRES_USER: ${QA_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${QA_SERVICE_DB_PASSWORD}
    ports:
      - "${QA_SERVICE_DB_PORT}:5432"
    volumes:
      - qa-postgres-data:/var/lib/postgresql/data
    networks:
      - leilao-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${QA_SERVICE_DB_USER:-qa_user} -d qa_service_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # QA-SERVICE REDIS
  # ============================================================
  redis-qa:
    image: redis:8.8.0-alpine
    container_name: qa-service-redis
    ports:
      - "${QA_SERVICE_REDIS_PORT}:6379"
    volumes:
      - qa-redis-data:/data
    networks:
      - leilao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # NOTIFICATION-SERVICE DATABASE
  # ============================================================
  notificationdb:
    container_name: notificationdb
    image: postgres:17-alpine3.23
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_DB: ${NOTIFICATION_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${NOTIFICATION_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "${NOTIFICATION_SERVICE_POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - notificationdb-data:/var/lib/postgresql/data
      - ./src/main/resources/db/notification-service:/docker-entrypoint-initdb.d
    networks:
      - leilao-network

  # ============================================================
  # REPORT-SERVICE DATABASE
  # ============================================================
  report-service-postgres:
    image: postgres:17-alpine3.23
    container_name: report-service-postgres
    ports:
      - "${REPORT_SERVICE_DB_PORT}:5432"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://report-service-postgres:5432/report
      POSTGRES_DB: report
      POSTGRES_USER: ${REPORT_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD}
    volumes:
      - report-service-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db/report-service:/docker-entrypoint-initdb.d
    networks:
      - leilao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # TRANSACTION-SERVICE DATABASE
  # ============================================================
  transaction-service-db:
    image: postgres:17-alpine3.23
    container_name: transaction-service-db
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: ${TRANSACTION_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_SERVICE_DB_PASSWORD}
    ports:
      - "${TRANSACTION_SERVICE_DB_PORT}:5432"
    volumes:
      - transactiondb-data:/var/lib/postgresql/data
      - ./src/main/resources/db/transaction-service:/docker-entrypoint-initdb.d
    networks:
      - leilao-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TRANSACTION_SERVICE_DB_USER} -d transactiondb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # LISTING-SERVICE DATABASE
  # ============================================================
  listing-service-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: listing-service-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.http.ssl.enabled=false
    ports:
      - "${LISTING_SERVICE_ELASTIC_PORT}:9200"
    volumes:
      - listing-elastic-data:/usr/share/elasticsearch/data
    networks:
      - leilao-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ============================================================
  # REPORT-SERVICE
  # ============================================================
  report-service:
    container_name: report-service
    image: gabrielmeruzzi/report-service:latest
    restart: always
    ports:
      - "${REPORT_SERVICE_PORT}:8081"
    environment:
      REPORT_SERVICE_PORT: ${REPORT_SERVICE_PORT}
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://report-service-postgres:5432/report}"
      REPORT_SERVICE_DB_USER: ${REPORT_SERVICE_DB_USER:-report}
      REPORT_SERVICE_DB_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD:-report}
      KAFKA_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
    networks:
      - leilao-network
    depends_on:
      report-service-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ============================================================
  # USER-SERVICE
  # ============================================================
  user-service:
    container_name: user-service
    image: shyuu7/user-service:latest
    restart: always
    ports:
      - "${USER_SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${USER_SERVICE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_CLIENT_SECRET_USER_SERVICE: ${KEYCLOAK_CLIENT_SECRET_USER_SERVICE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      USER_SERVICE_S3_BUCKET_NAME: ${USER_SERVICE_S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      SPRING_DATA_REDIS_HOST: ${USER_SERVICE_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${USER_SERVICE_REDIS_PORT}
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
    networks:
      - leilao-network
    depends_on:
      user-service-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================
  # NOTIFICATION-SERVICE
  # ============================================================
  notification-service:
    container_name: notification-service
    image: oleiloeiroonline/notification-service:latest
    env_file:
      - .env
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      notificationdb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ksqldb-init:
        condition: service_completed_successfully
    networks:
      - leilao-network

  # ============================================================
  # REVIEW-SERVICE
  # ============================================================
  review-service:
    container_name: review-service
    image: gabrielmeruzzi/review-service:latest
    restart: always
    ports:
      - "${REVIEW_SERVICE_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      REVIEW_SERVICE_PORT: ${REVIEW_SERVICE_PORT}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_REVIEW}
      REVIEW_SERVICE_DB_USER: ${REVIEW_SERVICE_DB_USER}
      REVIEW_SERVICE_DB_PASSWORD: ${REVIEW_SERVICE_DB_PASSWORD}
      KAFKA_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
    networks:
      - leilao-network
    depends_on:
      review-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ============================================================
  # QA-SERVICE
  # ============================================================
  qa-service:
    image: sylviocheleiro/qa-service:latest
    container_name: qa-service
    restart: unless-stopped
    ports:
      - "${QA_SERVICE_PORT}:8098"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      QA_SERVICE_PORT: 8098
      QA_SERVICE_DB_URL: jdbc:postgresql://postgres-qa:5432/qa_service_db
      QA_SERVICE_DB_USER: ${QA_SERVICE_DB_USER}
      QA_SERVICE_DB_PASSWORD: ${QA_SERVICE_DB_PASSWORD}
      KAFKA_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      QA_SERVICE_REDIS_HOST: ${QA_SERVICE_REDIS_HOST}
      QA_SERVICE_REDIS_PORT: ${QA_SERVICE_REDIS_PORT}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      postgres-qa:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis-qa:
        condition: service_healthy
    networks:
      - leilao-network

  # ============================================================
  # TRANSACTION-SERVICE
  # ============================================================
  transaction-service:
    image: nelsongrossoni/transaction_service:v1.1.0
    container_name: transaction-service
    restart: always
    ports:
      - "${TRANSACTION_SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${TRANSACTION_SERVICE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${TRANSACTION_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TRANSACTION_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
    networks:
      - leilao-network
    depends_on:
      transaction-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================
  # PAYMENT-SERVICE
  # ============================================================
  payment-service:
    image: oleiloeiroonline/payment-service:latest
    container_name: payment-service
    env_file:
      - .env
    ports:
      - "${PAYMENT_SERVICE_PORT}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      paymentdb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - leilao-network

  # ============================================================
  # LISTING-SERVICE
  # ============================================================
  listing-service:
    image: pedrovncs/listing-service:latest
    container_name: listing-service
    ports:
      - "${LISTING_SERVICE_PORT}:8080"
    environment:
      LISTING_SERVICE_PORT: ${LISTING_SERVICE_PORT}
      LISTING_SERVICE_ELASTIC_URI: ${LISTING_SERVICE_ELASTIC_URI}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      listing-service-elastic:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - leilao-network

  # ============================================================
  # AUCTION-SERVICE
  # ============================================================
  auction-service:
    image: pedrovncs/auction-service:latest
    container_name: auction-service
    ports:
      - "${AUCTION_SERVICE_PORT}:8080"
    environment:
      AUCTION_SERVICE_S3_ENDPOINT: ${AUCTION_SERVICE_S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      S3_REGION: us-east-fake
      AUCTION_SERVICE_S3_BUCKET_NAME: ${AUCTION_SERVICE_S3_BUCKET_NAME}
      AUCTION_SERVICE_POSTGRES_USER: ${AUCTION_SERVICE_POSTGRES_USER}
      AUCTION_SERVICE_POSTGRES_PASSWORD: ${AUCTION_SERVICE_POSTGRES_PASSWORD}
      AUCTION_SERVICE_POSTGRES_HOST: auction-service-postgres
      AUCTION_SERVICE_PORT: ${AUCTION_SERVICE_PORT}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    depends_on:
